<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Objective Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-box {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 2rem;
            border-radius: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-option {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-align: left;
            transition: 0.3s;
        }

        .btn-option:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
        }

        .correct {
            background: #22c55e !important;
            border-color: #22c55e;
        }

        .wrong {
            background: #ef4444 !important;
            border-color: #ef4444;
        }

        .timer {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fbbf24;
            margin: 10px 0;
        }

        #quizCard {
            display: none;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="main-box">
        <h1 class="h3 mb-2">Objective Quiz</h1>
        <h3 id="testTitle" class="text-warning mb-4">Select a Day</h3>

        <div id="inputBox">
            <select id="daySelector" class="form-select bg-dark text-white border-0 mb-4"></select>
            <button class="btn btn-primary w-100" onclick="startQuiz()">Start Quiz</button>
        </div>

        <div class="quiz-card" id="quizCard">
            <div id="questionNumber" class="text-primary bg-dan" style="font-size: 1.5rem;"></div>
            <div id="qText" class="h4 mb-3"></div>
            <div id="qRoman"
                style="background: #e11d48; padding: 2px 15px; border-radius: 20px; font-size: 1.5rem; margin-bottom: 10px; display: inline-block;">
            </div>
            <div class="timer" id="timer">10</div>
            <div id="optionsContainer" class="w-100"></div>
            <button class="btn btn-outline-light mt-4 w-100" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <audio id="tickSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <script>
        let questions = [], currentIndex = 0, score = 0, syllabusData = {}, countdown, timeLeft = 10;

        // ObjectiveTest.html ke liye ye script use karein
        async function loadSyllabus() {
            try {
                const response = await fetch("objective_syllabus.json");
                syllabusData = await response.json();

                const dropdown = document.getElementById("daySelector");
                dropdown.innerHTML = ""; // Clear existing options

                Object.keys(syllabusData).forEach(day => {
                    let opt = document.createElement("option");
                    opt.value = day;
                    // Example: Day 1 - Self Introduction
                    opt.textContent = `Day ${day.replace("day", "")} - ${syllabusData[day].topic}`;
                    dropdown.appendChild(opt);
                });

                // URL se 'day' parameter check karein
                const params = new URLSearchParams(window.location.search);
                const dayParam = params.get("day"); // '1' ya '2' aayega

                if (dayParam) {
                    const dayKey = "day" + dayParam; // 'day1' ya 'day2' banega
                    if (syllabusData[dayKey]) {
                        dropdown.value = dayKey;
                        updateTitle(dayKey);
                    }
                } else {
                    updateTitle(dropdown.value); // Default load
                }

                dropdown.addEventListener("change", (e) => updateTitle(e.target.value));
            } catch (e) {
                console.error(e);
                alert("JSON file load error! Check: objective_syllabus.json");
            }
        }

        function updateTitle(dayKey) {
            document.getElementById("testTitle").innerText = syllabusData[dayKey].topic;
        }

        window.onload = loadSyllabus;
        function updateTitle(dayKey) { document.getElementById("testTitle").innerText = syllabusData[dayKey].topic; }

        function startQuiz() {
            const day = document.getElementById("daySelector").value;
            updateTitle(day);
            questions = syllabusData[day].questions.map(line => {
                let p = line.split("|").map(x => x.trim());
                return { q1: p[0], q2: p[1], correct: p[2], opts: [p[2], p[3], p[4], p[5]].sort(() => Math.random() - 0.5) };
            });
            document.getElementById("inputBox").style.display = "none";
            document.getElementById("quizCard").style.display = "flex";
            currentIndex = 0;
            showQuestion();
        }

        function showQuestion() {
            clearInterval(countdown);
            let q = questions[currentIndex];
            document.getElementById("questionNumber").innerText = `Question ${currentIndex + 1}/${questions.length}`;
            document.getElementById("qText").innerHTML = q.q1;
            document.getElementById("qRoman").innerText = q.q2;

            let container = document.getElementById("optionsContainer");
            container.innerHTML = "";
            let labels = ['A', 'B', 'C', 'D'];
            q.opts.forEach((opt, i) => {
                let btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerHTML = `<strong>${labels[i]}.</strong> ${opt}`;
                btn.onclick = () => checkAnswer(btn, opt);
                container.appendChild(btn);
            });
            startTimer();
        }

        function startTimer() {
            timeLeft = 10;
            document.getElementById("timer").innerText = timeLeft;
            countdown = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                if (timeLeft > 0) document.getElementById("tickSound").play();
                if (timeLeft <= 0) { clearInterval(countdown); alert("Time Up!"); }
            }, 1000);
        }

        function checkAnswer(btn, selected) {
            clearInterval(countdown);
            document.querySelectorAll(".btn-option").forEach(b => b.disabled = true);
            if (selected === questions[currentIndex].correct) { btn.classList.add("correct"); score++; }
            else btn.classList.add("wrong");
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) showQuestion();
            else { document.getElementById("quizCard").innerHTML = `<h3 class="mb-3">Quiz Finished! Score: ${score}</h3><button class="btn btn-primary" onclick="location.reload()">Restart</button>`; }
        }

        window.onload = loadSyllabus;
    </script>
</body>

</html>
