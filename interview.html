{
  question: "70. Can you explain the Collection Pyramid?",
  answer: `The Collection Pyramid is a model that shows how debt gets collected over time — from early stages (soft collections) to late stages (hard collections/legal action).

At the top of the pyramid, when the account is new (0–30 days past due), the calls are soft and friendly — just simple reminders.

As the account gets older (30–90 days past due), the tone becomes a little stronger. We may offer installment plans or settlements to help the customer pay.

If the account is still unpaid after 90–120+ days, it usually moves to third-party collections. At this stage, the approach is firmer, because recovery chances are lower.

At the very bottom of the pyramid, only a small percentage of accounts go into legal action or recovery stage.

In simple words: The Collection Pyramid begins with many customers at the top who usually pay after soft reminders. As time passes, fewer customers remain unpaid, so the collection steps become tougher at the bottom.`
},

{
    question: "78. What are KRA's and KPI's in BPO?",
    answer: `KRA means **Key Responsibility Areas**. These are the main duties or responsibilities of an employee.
For example – In a BPO, my KRA is to handle customer queries, solve problems, and give good service.

KPI means **Key Performance Indicators**. These are the numbers or targets used to check how well I am doing my work.

Important KPI's in BPO are: <br><br>
• **CSAT score** – Customer satisfaction rating. Shows if the customer is happy with my support. <br>
• **DSAT score** – Dissatisfaction rating. Shows if the customer is unhappy. <br>
• **AHT (Average Handling Time)** – The average time I take to handle a chat or call. <br>
• **FCR (First Call Resolution)** – Solving customer issue in the first attempt without follow-up. <br>
• **ACWT (After Call Work Time)** – The time I take to complete notes or work after a chat ends. <br>
• **Shift Adherence** – How well I follow my given shift timings. <br>
• **Login Hours** – Total time I stay logged in to take calls/chats. <br>
• **Repeat Ratio** – How many times a customer has to contact again for the same issue (lower is better). <br>
• **Call Quality** – How polite, clear, and correct I am while talking/chatting with customers. <br>
• **Attendance** – How regular I am in reporting to work. <br><br>

So, KRA tells me *what my job is*, and KPI tells me *how well I am doing it*.`

{

    answer: `Here are some easy explanations of billing terms: <br><br>

• **Pro-Rata Charges** – When a customer changes their plan mid-month, they pay only for the days they used it. <br>
• **Recurring Charges** – Fixed monthly charges like plan rent that repeat every month. <br>
• **Billing Cycle** – The start and end dates of the monthly bill period. <br>
• **Bill Due Date** – The last date to pay the bill. <br>
• **Overdue Charges** – Extra fees added if the bill is not paid on time. <br>
• **One-Time Charge** – A single payment, like activation or installation fees. <br>
• **Surcharge** – Additional fees like late fees or government taxes. <br>
• **Service Charge** – Small fees for specific services (example: requesting a paper bill). <br>
• **Autopay** – A facility where the bill gets automatically deducted from the bank account or card every month. <br><br>

These terms are simple and easy for HR to understand.`

        function liveSearchAccordion() {
    const input = document.getElementById("accordionSearch").value.trim().toLowerCase();
    const items = document.querySelectorAll("#interviewAccordion .accordion-item");

    items.forEach(item => {
        const questionEl = item.querySelector(".accordion-button");
        const answerEl = item.querySelector(".accordion-body");

        const originalQuestion = questionEl.textContent;
        const originalAnswer = answerEl.textContent;

        const questionLower = originalQuestion.toLowerCase();
        const answerLower = originalAnswer.toLowerCase();

        const matchFound = questionLower.includes(input) || answerLower.includes(input);

        if (matchFound && input !== "") {
            // Highlight in question
            const highlightedQuestion = originalQuestion.replace(new RegExp(`(${input})`, "gi"), `<mark>$1</mark>`);
            const highlightedAnswer = originalAnswer.replace(new RegExp(`(${input})`, "gi"), `<mark>$1</mark>`);

            questionEl.innerHTML = highlightedQuestion;
            answerEl.innerHTML = highlightedAnswer;
        } else {
            // Remove highlighting by resetting textContent
            questionEl.innerHTML = originalQuestion;
            answerEl.innerHTML = originalAnswer;
        }

        item.style.display = matchFound || input === "" ? "" : "none";
    });
}
