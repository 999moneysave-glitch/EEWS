<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY ENGLISH WITH SARFRAZ Translation Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            padding: 15px;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Watermark */
        body::before {
            content: "Easy English With Sarfraz";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 70px;
            font-weight: bold;
            color: rgba(255, 255, 255, .03);
            z-index: -1;
            white-space: nowrap;
        }

        /* Main Card */
        .container {
            max-width: 750px;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
        }

        /* Heading */
        .main-title {
            text-align: center;
            font-weight: 800;
            font-size: 32px;
            color: #fff;
            margin-bottom: 20px;
        }

        .main-title span {
            color: #38bdf8;
        }

        /* Question Card */
        .question-box {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            color: white;
        }

        /* Header Row */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Timer always right */
        .timer-box {
            background: #ef4444;
            color: white;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 12px;
            min-width: 90px;
            text-align: center;
            box-shadow: 0 0 15px rgba(239, 68, 68, .4);
        }

        /* Question */
        .question-text {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, .15);
            background: rgba(255, 255, 255, .08);
            color: white;
            padding: 15px;
            font-size: 16px;
            resize: none;
            margin-top: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, .3);
        }

        /* Input */
        .form-control {
            border-radius: 15px;
            height: 50px;
        }

        /* Button */
        .custom-btn {
            background: linear-gradient(45deg, #38bdf8, #2563eb);
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 15px;
            padding: 12px;
            width: 100%;
            margin-top: 15px;
            transition: .3s;
        }

        .custom-btn:hover {
            transform: translateY(-2px);
        }

        /* Mobile */
        @media(max-width:768px) {

            .container {
                padding: 15px;
                border-radius: 20px;
            }

            .main-title {
                font-size: 24px;
            }

            .question-text {
                font-size: 18px;
            }

            .timer-box {
                min-width: 75px;
                font-size: 16px;
                padding: 8px 12px;
            }

            textarea {
                min-height: 100px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="main-title">
            <span>📚 EASY ENGLISH WITH SARFRAZ</span><br>
            Translation Assessment Test
        </h1>
        <input type="text" id="studentName" class="form-control mb-3" placeholder="Enter Student Name">
        <div id="quizContainer"></div>
    </div>
    <!-- Completion Page -->

    <div id="completionPage" style="display:none;">

        <div class="container text-center mt-5">

            <div class="question-box">

                <h1 class="text-success">
                    🎉 Test Completed Successfully
                </h1>

                <p class="mt-3 fs-5">
                    Your assessment has been completed.
                </p>

                <p class="text-primary fw-bold">
                    Go to download and share your result PDF
                    in the WhatsApp group.
                </p>

                <a href="https://wa.me/917324930960?text=Hello%20Sarfraz%20Sir,%20I%20have%20completed%20the%20translation%20test.%20Please%20find%20my%20result."
                    class="btn btn-success w-100 mt-3" target="_blank">

                    📤 Open Teacher's WhatsApp and send the downloaded PDF.

                </a>

                <button class="btn btn-primary w-100 mt-3" onclick="location.reload()">

                    🔄 Start New Test

                </button>

            </div>

        </div>

    </div>

    <script>
        const examples = [
            {
                question: "मैंने खा लिया है। / Maine kha liya hai.",
                correctAnswer: "I have eaten.",
                userAnswer: "",
                score: 0
            },
            {
                question: "मैंने नहीं खाया है। / Maine nahin khaya hai.",
                correctAnswer: "I have not eaten.",
                userAnswer: "",
                score: 0
            },
            {
                question: "क्या मैंने खाया है? / Kya maine khaya hai?",
                correctAnswer: "Have I eaten?",
                userAnswer: "",
                score: 0
            },
            {
                question: "क्या मैंने नहीं खाया है? / Kya maine nahin khaya hai?",
                correctAnswer: "Have I not eaten?",
                userAnswer: "",
                score: 0
            },
            {
                question: "मैंने निश्चित रूप से खाया है। / Maine nishchit roop se khaya hai.",
                correctAnswer: "I have certainly eaten. / I have eaten for sure.",
                userAnswer: "",
                score: 0
            },
            {
                question: "मैंने क्यों खाया है? / Maine kyon khaya hai?",
                correctAnswer: "Why have I eaten?",
                userAnswer: "",
                score: 0
            },
            {
                question: "मैंने कैसे खाया है? / Maine kaise khaya hai?",
                correctAnswer: "How have I eaten?",
                userAnswer: "",
                score: 0
            },
            {
                question: "मैंने क्या खाया है? / Maine kya khaya hai?",
                correctAnswer: "What have I eaten?",
                userAnswer: "",
                score: 0
            },
            {
                question: "मैंने किसका खाया है? / Maine kiska khaya hai?",
                correctAnswer: "Whose have I eaten?",
                userAnswer: "",
                score: 0
            },
            {
                question: "मैंने किसे खाया है? / Maine kise khaya hai?",
                correctAnswer: "Whom have I eaten?",
                userAnswer: "",
                score: 0
            },
            {
                question: "मुझे खाना है। / Mujhe khana hai.",
                correctAnswer: "I have to eat.",
                userAnswer: "",
                score: 0
            },
            {
                question: "मुझे खाना पड़ेगा। / Mujhe khana padega.",
                correctAnswer: "I have to eat.",
                userAnswer: "",
                score: 0
            },
            {
                question: "जब बारिश होगी, तब मैं स्नान करूँगा। / Jab barish hogi, tab main snan karunga.",
                correctAnswer: "When it rains, I will take a bath.",
                userAnswer: "",
                score: 0
            },

            {
                question: "तुम कल आओगे ना? / Tum kal aaoge na?",
                correctAnswer: "You will come tomorrow, won't you?",
                userAnswer: "",
                score: 0
            },
            {
                question: "एक जंगल में एक राजा था। / Ek jangal mein ek raja tha.",
                correctAnswer: "There was a king in a forest.",
                userAnswer: "",
                score: 0
            },
            {
                question: "एक जंगल में एक शेर रहता था। / Ek jangal mein ek sher rehta tha.",
                correctAnswer: "There lived a lion in a forest.",
                userAnswer: "",
                score: 0
            },
        ];

        let currentIdx = 0, timer;

        function calculateScore(user, correct) {
            user = user.toLowerCase().replace(/[?.!]/g, "").trim();
            correct = correct.toLowerCase().replace(/[?.!]/g, "").trim();
            if (user === correct) return 100;
            let userWords = user.split(" "), correctWords = correct.split(" ");
            let matches = userWords.filter(w => correctWords.includes(w)).length;
            return (matches >= correctWords.length - 1 && user.length > 0) ? 90 : 0;
        }

        function showQuestion(index) {
            if (index >= examples.length) return;

            const isLast = (index === examples.length - 1);
            const container = document.getElementById('quizContainer');
            container.innerHTML = `
<div class="question-box">

    <div class="header-section">

        <h5 class="mb-0 text-warning">
            Question ${index + 1} / ${examples.length}
        </h5>

        <div class="timer-box">
            ⏳ <span id="timerLabel">60</span>s
        </div>

    </div>

    <div class="question-text">
        ${examples[index].question}
    </div>

    <textarea
        id="currentAnswer"
        placeholder="Type English Translation Here...">
    </textarea>

    <button
        class="custom-btn"
        onclick="handleButtonClick()">

        ${isLast
                    ? "📄 Submit Exam & Download PDF"
                    : "➡️ Next Question"}

    </button>

</div>
`;

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            let time = 60;
            timer = setInterval(() => {
                time--;
                document.getElementById("timerLabel").innerText = time + "s";
                if (time <= 0) handleButtonClick();
            }, 1000);
        }

        function handleButtonClick() {
            clearInterval(timer);
            const ans = document.getElementById("currentAnswer").value.trim();
            examples[currentIdx].userAnswer = ans || "No Answer";
            examples[currentIdx].score = calculateScore(examples[currentIdx].userAnswer, examples[currentIdx].correctAnswer);

            if (currentIdx === examples.length - 1) {
                submitAndDownload();
            } else {
                currentIdx++;
                showQuestion(currentIdx);
            }
        }

        function submitAndDownload() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) return Swal.fire('Error', 'Please enter your name!', 'error');

            let totalScore = 0;
            examples.forEach(ex => totalScore += ex.score);
            let average = Math.round(totalScore / examples.length);

            let content = [
                { text: `Test Result: ${name}`, fontSize: 18, bold: true },
                { text: `Average Score: ${average}% | Status: ${average >= 70 ? 'PASS' : 'FAIL'}\n\n`, fontSize: 16, bold: true, color: average >= 70 ? 'green' : 'red' }
            ];

            examples.forEach((ex, i) => {
                const romanOnly = ex.question.split('/')[1] ? ex.question.split('/')[1].trim() : ex.question;
                content.push(
                    { text: `Q${i + 1}: ${romanOnly}\n`, color: 'red', bold: true },
                    { text: `Your Answer (Score: ${ex.score}%): ${ex.userAnswer}\n`, color: 'green' },
                    { text: `Correct Answer: ${ex.correctAnswer}\n\n`, color: 'blue' }
                );
            });

            pdfMake.createPdf({ content }).download(`${name}_Result.pdf`);
            Swal.fire({
                title: 'Test Completed!',
                text: 'Click OK to view completion page.',
                icon: 'success',
                confirmButtonText: 'OK'
            }).then(() => {
                showCompletionPage();
            });
        }

        window.onload = () => showQuestion(0);


        let lastPdfDoc = null;

        function showCompletionPage() {

            document.querySelector('.container').style.display = 'none';

            document.getElementById('completionPage').style.display = 'block';
        }

        function downloadAgain() {

            if (lastPdfDoc) {
                lastPdfDoc.download();
            }
        }
    </script>
</body>

</html>
